<!-- Header START -->
<header class="navbar-light navbar-sticky border-bottom bg-white">
  <nav class="navbar navbar-expand-lg py-3">
    <div class="container">
      <!-- Logo START -->
      <a class="navbar-brand" href="index.html">
        <img class="light-mode-item navbar-brand-item" src="assets/images/logo.svg" alt="logo" />
        <img
          class="dark-mode-item navbar-brand-item"
          src="assets/images/logo-light.svg"
          alt="logo"
        />
      </a>
      <!-- Logo END -->

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              routerLink="/"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active" routerLink="/courses-list">Courses</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active" routerLink="/categories">Categories</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLinkActive="active" routerLink="/about">About</a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          @if (!isLoggedIn) {
            <a routerLink="/login" class="btn btn-outline-primary px-4">Login</a>
            <a routerLink="/signup" class="btn btn-primary px-4">Sign Up</a>
          } @else {
            <button (click)="logout()" class="btn btn-outline-danger px-4">Logout</button>
          }
        </div>
      </div>
    </div>
  </nav>
</header>
